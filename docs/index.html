*{box-sizing:border-box}

.stamp small{display:block;font:600 .68rem var(--body);letter-spacing:.25em;text-transform:uppercase;margin-bottom:4px}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mini{height:8px;border-radius:4px;background:var(--line);min-width:80px;overflow:hidden}

.qitem>span{min-width:0;overflow-wrap:anywhere}
details>summary{cursor:pointer;font-weight:600;padding:8px 0}

.gate{max-width:460px;margin-inline:auto;width:100%}
@media (max-width:480px){.card{padding:16px}.stamp b{font-size:2.5rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">

  <main id="app" aria-live="polite"></main>

</div>
<script>
'use strict';
const CFG={"url":"https://parnrdgtseefaacwzmvj.supabase.co","key":"sb_publishable_Cp0MRsAL27f5TAd6N9uI2A_NcjBS5M9"};
const DATA=null;
const ONLINE_MODE=!DATA;
const K={extra:'seniat-quiz-extra-v1',prog:'seniat-quiz-prog-v1',run:'seniat-quiz-run-v1',hist:'seniat-quiz-hist-v1',sess:'seniat-quiz-sess-v1',theme:'seniat-quiz-theme-v1',email:'seniat-quiz-email-v1'};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(v===false||v==null)continue;if(x==='class')e.className=v;else if(x.startsWith('on'))e[x]=v;else if(v===true)e.setAttribute(x,'');else e.setAttribute(x,v)}k.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c))});return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L='ABCDEFGH';
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const qk=q=>q.clase+':'+hash(q.q);
const correct=q=>Array.isArray(q.a)?q.a:[q.a];
const isOk=(q,s)=>{const c=correct(q);return s.length===c.length&&c.every(x=>s.includes(x))};
const fmtDate=d=>new Date(d).toLocaleDateString('es-VE',{day:'numeric',month:'long',year:'numeric'});

/* ---------- tema ---------- */
function applyTheme(t){const r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme')}
applyTheme(store.get(K.theme,'auto'));

/* ---------- acceso (solo versión en línea) ---------- */
const auth={
  session:ONLINE_MODE?store.get(K.sess,null):null,
  async api(path,{body,token,method='POST'}={}){
    const h={apikey:CFG.key,'Content-Type':'application/json'};
    if(token)h.Authorization='Bearer '+token;
    let r;
    try{r=await fetch(CFG.url+path,{method,headers:h,body:body?JSON.stringify(body):undefined})}
    catch(e){throw {status:0,msg:'Sin conexión. Revisa tu internet e inténtalo de nuevo.'}}
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok)throw {status:r.status,code:j.error_code||j.code,msg:j.msg||j.message||j.error_description||j.error||('Error '+r.status)};
    return j;
  },
  save(s){if(!s){this.session=null;store.del(K.sess);return}const n={access_token:s.access_token,refresh_token:s.refresh_token,expires_at:s.expires_at||Math.floor(Date.now()/1000)+(s.expires_in||3600),email:(s.user&&s.user.email)||s.email||''};this.session=n;store.set(K.sess,n)},
  async token(){
    const s=this.session;if(!s)return null;
    if(s.expires_at-30>Date.now()/1000)return s.access_token;
    try{const j=await this.api('/auth/v1/token?grant_type=refresh_token',{body:{refresh_token:s.refresh_token}});j.email=s.email;this.save(j);return j.access_token}
    catch(e){if(e.status===0)throw e;this.save(null);return null}
  },
  sendCode:email=>auth.api('/auth/v1/otp',{body:{email,create_user:true}}),
  async verify(email,token){const j=await auth.api('/auth/v1/verify',{body:{type:'email',email,token}});j.email=email;auth.save(j);return j},
  async rpc(name){const t=await this.token();if(!t)throw {status:401,msg:'Sesión vencida.'};return this.api('/rest/v1/rpc/'+name,{token:t,body:{}})},
  async questions(){
    const t=await this.token();if(!t)throw {status:401,msg:'Sesión vencida.'};
    return this.api('/rest/v1/questions?select=id,clase,tema,tipo,q,o,a,e&order=clase.asc,id.asc',{token:t,method:'GET'});
  },
  async logout(){const t=this.session&&this.session.access_token;try{if(t)await this.api('/auth/v1/logout',{token:t})}catch(e){}this.save(null)}
};
let remote=null;      // preguntas descargadas tras iniciar sesión (solo en memoria)
let access=null;      // {allowed, expires_at}

/* ---------- banco ---------- */
let extra=store.get(K.extra,[]);if(!Array.isArray(extra))extra=[];
const saveExtra=()=>store.set(K.extra,extra);
const bank=()=>(DATA||remote||[]).concat(extra);
const classesList=()=>[...new Set(bank().map(q=>q.clase))].sort((a,b)=>a-b);

/* ---------- progreso local ---------- */
let prog=store.get(K.prog,{});if(!prog||typeof prog!=='object')prog={};
let hist=store.get(K.hist,[]);if(!Array.isArray(hist))hist=[];
const saveProg=()=>{store.set(K.prog,prog);store.set(K.hist,hist.slice(-40))};

/* ---------- estado ---------- */
const st={tab:'quiz',classes:null,n:20,mode:'examen',source:'all',flagsOnly:false,filter:'all'};
let run=null;
const app=$('#app');

function saveRun(){
  if(!run){store.del(K.run);return}
  store.set(K.run,{keys:run.qs.map(qk),order:run.order,ans:run.ans,flags:run.flags,checked:run.checked,i:run.i,mode:run.mode,done:run.done});
}
function loadRun(){
  const r=store.get(K.run,null);if(!r||!Array.isArray(r.keys))return null;
  const map=new Map(bank().map(q=>[qk(q),q]));
  const qs=r.keys.map(k=>map.get(k));
  if(!qs.length||qs.some(q=>!q))return null;
  return {qs,order:r.order,ans:r.ans,flags:r.flags||qs.map(()=>false),checked:r.checked||qs.map(()=>false),i:r.i||0,mode:r.mode||'examen',done:!!r.done};
}

/* ---------- navegación ---------- */
function chrome(){
  const authed=!ONLINE_MODE?true:(auth.session&&access&&access.allowed&&remote);
  const tabs=$('#tabs');tabs.hidden=!authed;tabs.replaceChildren();
  if(authed){[['quiz','Practicar'],['progress','Mi progreso'],['bank','Mi banco']].forEach(([id,lab])=>{
    tabs.append(el('button',{class:'tab',role:'tab','aria-selected':String(st.tab===id),onclick:()=>{st.tab=id;render()}},lab))})}
  const who=$('#who');who.replaceChildren();
  const th=el('button',{class:'btn quiet',type:'button','aria-label':'Cambiar tema de color',onclick:()=>{const cur=store.get(K.theme,'auto');const nx=cur==='auto'?'dark':cur==='dark'?'light':'auto';store.set(K.theme,nx);applyTheme(nx);th.textContent='Tema: '+({auto:'auto',dark:'oscuro',light:'claro'})[nx]}},'Tema: '+({auto:'auto',dark:'oscuro',light:'claro'})[store.get(K.theme,'auto')]);
  who.append(th);
  if(ONLINE_MODE&&auth.session){who.append(el('span',{},auth.session.email||''),el('button',{class:'btn quiet',type:'button',onclick:async()=>{await auth.logout();remote=null;access=null;run=null;st.tab='quiz';render()}},'Salir'))}
}
function render(){
  chrome();
  app.replaceChildren();
  if(ONLINE_MODE&&!(auth.session&&access&&access.allowed&&remote))return gateOrBoot();
  if(st.tab==='bank')return bankView();
  if(st.tab==='progress')return progressView();
  if(!run)return setup();
  if(run.done)return results();
  question();
}

/* ---------- pantalla de acceso ---------- */
let gate={step:'email',email:store.get(K.email,''),msg:'',err:false,busy:false,wait:0,timer:null};
async function gateOrBoot(){
  if(auth.session&&!gate.booting){
    gate.booting=true;
    app.append(el('section',{class:'card gate'},el('p',{},'Verificando tu acceso…')));
    try{
      access=await auth.rpc('my_access');
      if(access&&access.allowed){remote=await auth.questions();gate.booting=false;return render()}
      gate.booting=false;return expired();
    }catch(e){
      gate.booting=false;
      if(e.status===401||e.status===403){auth.save(null);gate.msg='Tu sesión venció. Inicia sesión de nuevo.';gate.err=true;gate.step='email';return render()}
      gate.msg=e.msg||'No se pudo verificar el acceso.';gate.err=true;
      return app.append(el('section',{class:'card gate'},el('h2',{},'No se pudo cargar el quiz'),el('p',{class:'msg err'},gate.msg),el('button',{class:'btn primary',onclick:()=>render()},'Reintentar')));
    }
  }
  if(auth.session)return;
  gateView();
}
function expired(){
  const exp=access&&access.expires_at;
  app.replaceChildren(el('section',{class:'card gate'},el('h2',{},'Tu acceso terminó'),
    el('p',{},exp?`Tu acceso venció el ${fmtDate(exp)}.`:'Este correo ya no tiene acceso al quiz.'),
    el('p',{class:'hint'},'Si necesitas más tiempo, pídele a quien administra el quiz que lo extienda.'),
    el('button',{class:'btn',onclick:async()=>{await auth.logout();access=null;render()}},'Usar otro correo')));
}
function gateView(){
  const msg=el('p',{class:'msg'+(gate.err?' err':gate.msg?' good':''),role:'status'},gate.msg);
  const card=el('section',{class:'card gate'});
  if(gate.step==='email'){
    const em=el('input',{type:'email',id:'em',autocomplete:'email',inputmode:'email',required:true,placeholder:'tucorreo@ejemplo.com',value:gate.email});
    const go=el('button',{class:'btn primary',type:'submit'},'Enviar código');
    const form=el('form',{class:'row',style:'flex-direction:column;align-items:stretch;gap:14px'},
      el('label',{class:'f',for:'em'},'Tu correo',em),go);
    form.onsubmit=async ev=>{ev.preventDefault();const v=em.value.trim().toLowerCase();if(!v)return;
      go.disabled=true;go.textContent='Enviando…';
      try{await auth.sendCode(v);gate.email=v;store.set(K.email,v);gate.step='code';gate.msg='Te enviamos un código. Revisa también la carpeta de spam.';gate.err=false;startWait();render()}
      catch(e){gate.msg=e.status===429?'Pediste un código hace poco. Espera un minuto e inténtalo de nuevo.':e.status===0?e.msg:e.status>=500?'No se pudo enviar el código. Inténtalo en unos minutos.':'Ese correo no tiene acceso. Si es el correo que diste, pide que lo revisen.';gate.err=true;render()}};
    card.append(el('h2',{},'Entrar al quiz'),el('p',{class:'hint'},'Escribe el correo que le diste a quien administra el quiz. Te llegará un código de un solo uso. No necesitas crear cuenta ni contraseña.'),form,msg);
  }else{
    const cd=el('input',{type:'text',id:'cd',class:'code',inputmode:'numeric',autocomplete:'one-time-code',pattern:'[0-9]{6,10}',maxlength:'10',required:true,'aria-label':'Código de verificación'});

/* ---------- configuración ---------- */

function start(qs,mode){

      el('span',{class:'k','aria-hidden':'true'},q.tipo==='tf'?'':L[pos]),el('span',{},q.o[oi]));

  const dotsBox=el('div',{class:'dots','aria-label':'Mapa de preguntas'});
  function dots(){dotsBox.replaceChildren(...run.qs.map((_,j)=>el('button',{type:'button',class:'dot'+(run.ans[j].length?' done':'')+(j===run.i?' cur':'')+(run.flags[j]?' flagged':''),'aria-label':`Ir a la pregunta ${j+1}${run.flags[j]?' (marcada)':''}`,onclick:()=>go(j)},String(j+1))))}
  dots();

    ok?null:el('span',{},'Respuesta correcta: '+correct(q).map(x=>q.o[x]).join('; ')),el('span',{class:'hint'},q.e))}
  app.append(el('section',{class:'card'},

    el('div',{class:'bar',role:'progressbar','aria-valuemin':'0','aria-valuemax':String(run.qs.length),'aria-valuenow':String(run.ans.filter(a=>a.length).length),'aria-label':'Preguntas respondidas'},el('i',{style:`width:${run.ans.filter(a=>a.length).length/run.qs.length*100}%`})),
    el('h2',{class:'q',id:'qtext',tabindex:'-1'},q.q),
    multi?el('p',{class:'hint'},'Marca todas las que correspondan.'):null,
    opts,fb,
    el('label',{class:'flag',for:'flag'},flag,'Marcar para revisar'),
    last&&pending?el('p',{class:'hint'},`Te faltan ${pending} pregunta${pending===1?'':'s'} sin responder. Cuentan como incorrectas.`):null,

/* ---------- atajos de teclado ---------- */
document.addEventListener('keydown',ev=>{
  if(!run||run.done||st.tab!=='quiz'||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  const t=ev.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)&&t.type!=='checkbox')return;
  const k=ev.key.toLowerCase(),q=run.qs[run.i];
  const idx='1234567890'.includes(k)&&k.length===1?(+k||10)-1:'abcdefgh'.includes(k)&&k.length===1?'abcdefgh'.indexOf(k):-1;
  if(idx>=0&&idx<q.o.length){const oi=run.order[run.i][idx];if(oi!==undefined){ev.preventDefault();choose(oi)}return}
  if(k==='enter'&&!(t&&t.tagName==='BUTTON')){ev.preventDefault();advance()}
  else if(k==='arrowright'&&run.i<run.qs.length-1){ev.preventDefault();go(run.i+1)}
  else if(k==='arrowleft'&&run.i>0){ev.preventDefault();go(run.i-1)}
});
